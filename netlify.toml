[build]
  publish = "."
  command = ""           # static; nothing to build

# ---------------------------------------------------------------------------
# Clean-URL serving (LOCKED naming): each route folder holds a route-labeled
# HTML file (e.g. /online-heartburn-treatment/online-heartburn-treatment.html)
# instead of index.html. The site ROOT is the only index.html and Netlify
# serves it at "/" automatically. The 200 rewrites below map each clean
# trailing-slash URL to its labeled file so the public URLs stay clean.
# Generated from the master file tree. A route missing here 404s, so keep this
# list in sync as new pages are built. Canonicals, internal links, and sitemap
# entries all stay on the clean trailing-slash URLs, unchanged.
# Rewrites are evaluated top-down (first match wins), so these specific
# trailing-slash rules sit ABOVE the trailing-slash canonicalizer at the end.
# ---------------------------------------------------------------------------

# --- Core ---
[[redirects]]
  from = "/how-it-works/"
  to = "/how-it-works/how-it-works.html"
  status = 200
[[redirects]]
  from = "/about/"
  to = "/about/about.html"
  status = 200
[[redirects]]
