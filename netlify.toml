# Canonicalize: add a trailing slash to any path that lacks one (only when no
# real file matches). Runs LAST so the labeled-file rewrites above win first.
[[redirects]]
  from = "/shipping-returns/"
  to = "/shipping-returns/shipping-returns.html"
  status = 200
[[redirects]]
  from = "/get-started/"
  to = "/get-started/get-started.html"
  status = 200
[[redirects]]
  from = "/*"
  to = "/:splat/"
  status = 301
  force = false

# --- Headers ---
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
